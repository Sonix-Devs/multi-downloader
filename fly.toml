app = "multi-downloader"
primary_region = "ams"

[build]

[env]
  PORT = "3000"
  MULTI_DOWNLOADER_ROOT = "/data/downloads"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/system/status"
    timeout = "5s"

[mounts]
  source = "multi_downloader_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
